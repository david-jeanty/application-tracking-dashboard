project_id = "application-tracking-dashboard"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://127.0.0.1:3100/auth/callback",
  "http://localhost:3000/auth/callback",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8

# OAuth 2.1 server. Supabase issues access tokens for our own users so an MCP
# client (Claude) can act as that user. Tokens are ordinary Supabase JWTs, so
# `auth.uid()` and every existing RLS policy keep working on the MCP path.
# `authorization_url_path` is the consent screen this application renders.
[auth.oauth_server]
enabled = true
authorization_url_path = "/oauth/consent"
# Lets an MCP client register itself instead of being pre-registered by hand.
# Registration alone grants no access: a signed-in user must still approve.
allow_dynamic_registration = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = false
max_frequency = "1m0s"
otp_length = 6
otp_expiry = 3600
